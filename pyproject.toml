[project]
name = "hcs-discovery-studio"
version = "2.0.0"
description = "Local-first, open-source AI drug-discovery research workbench with reproducible workflows, provenance and a headless CLI."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "hcsmedia" }]
keywords = ["cheminformatics", "drug-discovery", "rdkit", "reproducibility", "workflows"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "rdkit>=2024.3",
  "typer>=0.12",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["httpx>=0.27"]

[project.scripts]
hcs-discovery = "hcs_discovery.cli.main:cli"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
  "hypothesis>=6.100",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hcs_discovery"]

[tool.hatch.build.targets.wheel.hooks.custom]

# Ship the built single-page application inside the wheel so `pip install` produces
# a working local server without a Node toolchain.
[tool.hatch.build.targets.wheel.force-include]
"apps/web/dist" = "hcs_discovery/web"
# Alembic scripts, so installed wheels migrate (and record a revision) like a checkout.
"migrations/env.py" = "hcs_discovery/_alembic/env.py"
"migrations/script.py.mako" = "hcs_discovery/_alembic/script.py.mako"
"migrations/versions" = "hcs_discovery/_alembic/versions"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["hcs_discovery"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = []

# The published rdkit-stubs currently contain syntax that mypy 1.x cannot parse;
# treat RDKit as an untyped dependency rather than failing the whole type check.
[[tool.mypy.overrides]]
module = ["rdkit", "rdkit.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "network: test may use the network (never part of the default offline suite)",
  "slow: long-running test",
  "scientific: scientific validation/benchmark, not a correctness proof",
  "e2e: browser end-to-end test",
]
filterwarnings = ["error::DeprecationWarning:hcs_discovery.*"]

[tool.coverage.run]
source = ["hcs_discovery"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]
