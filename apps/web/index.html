<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b1114" />
    <meta
      name="description"
      content="HCS Discovery Studio — local-first, reproducible drug-discovery research workbench. Import, triage, dock and inspect every result. No account, no cloud key."
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://hcs-discovery-studio.vercel.app/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Social preview: a SPA sets these per route too (apps/web/src/lib/meta.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HCS Discovery Studio" />
    <meta property="og:title" content="HCS Discovery Studio — local-first drug-discovery workbench" />
    <meta
      property="og:description"
      content="Open, reproducible computational drug-discovery workbench. Runs on your machine or entirely in your browser; every result is inspectable."
    />
    <meta property="og:url" content="https://hcs-discovery-studio.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HCS Discovery Studio" />
    <meta
      name="twitter:description"
      content="Local-first drug-discovery workbench: transparent triage, docking, reports and an offline browser lab."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "HCS Discovery Studio",
        "applicationCategory": "ScienceApplication",
        "operatingSystem": "Windows, Linux, macOS (source)",
        "description": "Local-first, reproducible computational drug-discovery workbench with transparent triage, CPU docking, report export and an offline browser lab.",
        "url": "https://hcs-discovery-studio.vercel.app/",
        "license": "https://www.apache.org/licenses/LICENSE-2.0",
        "author": { "@type": "Organization", "name": "hcsmedia" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "isAccessibleForFree": true
      }
    </script>

    <title>HCS Discovery Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
