name: Release

# Publishes a release only for a tag whose exact commit already passed the full
# CI and CodeQL workflows. Tags never re-run a reduced test subset in place of
# those gates, existing releases are never modified, and assets are uploaded to
# a draft and verified before the release becomes public.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (vX.Y.Z or vX.Y.Z-rc.N)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  UV_VERSION: "0.12.3"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify tag and required gates for the exact commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the tagged commit
        id: resolve
        run: |
          set -euo pipefail
          sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          echo "Tag $RELEASE_TAG -> $sha"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify tag, package version and changelog agree
        run: uv run --no-project python scripts/release/verify_version.py "$RELEASE_TAG"
      - name: Require successful CI and CodeQL runs for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          for workflow in ci.yml codeql.yml; do
            latest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${SHA}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.event != "schedule")] | sort_by(.created_at) | last | (.conclusion // "none") + " " + (.html_url // "")')"
            conclusion="${latest%% *}"
            echo "$workflow for $SHA: $latest"
            if [ "$conclusion" != "success" ]; then
              echo "::error::$workflow has no successful completed run for $SHA (latest: ${conclusion}). Push the commit and wait for its gates before tagging."
              exit 1
            fi
          done
      - name: Refuse to touch an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release (or draft) for $RELEASE_TAG already exists. Releases are never modified; delete a failed draft manually or publish a new version."
            exit 1
          fi

  build-binaries:
    name: Build the one-file ${{ matrix.label }} binary
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: |
          uv sync --frozen
          # Build-only tool; kept out of the lockfile (GPL bootloader exception).
          uv pip install "pyinstaller==6.22.3"
      - name: Build and smoke-test the executable
        run: uv run python scripts/release/build_executable.py
      - name: Name the artifact per platform
        shell: bash
        run: |
          set -euo pipefail
          source_file="build/exe-dist/hcs-discovery"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then source_file="${source_file}.exe"; fi
          cp "$source_file" "build/exe-dist/hcs-discovery-${{ matrix.label }}${source_file##*hcs-discovery}"
      - name: Upload the executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hcs-discovery-${{ matrix.label }}
          path: build/exe-dist/hcs-discovery-${{ matrix.label }}*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Build, smoke-test, attest and publish
    needs: [verify, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the tag still points at the verified commit
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          actual="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$actual" != "$SHA" ]; then
            echo "::error::Tag $RELEASE_TAG moved from $SHA to $actual during the release."
            exit 1
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build the frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Install production dependencies for packaging
        run: uv sync --frozen --no-dev
      - name: Build the wheel
        run: uv build --wheel
      - name: Smoke-test the wheel in a clean environment
        env:
          HCS_DATA_DIR: ${{ runner.temp }}/release-smoke-data
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/release-venv"
          uv pip install --python "$RUNNER_TEMP/release-venv/bin/python" dist/*.whl
          BIN="$RUNNER_TEMP/release-venv/bin/hcs-discovery"
          expected="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          installed="$("$RUNNER_TEMP/release-venv/bin/python" -c 'import importlib.metadata as m; print(m.version("hcs-discovery-studio"))')"
          if [ "$installed" != "$expected" ]; then
            echo "::error::installed version $installed != project version $expected"
            exit 1
          fi
          "$BIN" version
          "$BIN" db upgrade
          revision="$("$BIN" db current)"
          echo "$revision"
          case "$revision" in *"not initialised"*) echo "::error::wheel did not record a migration revision"; exit 1;; esac
          "$BIN" doctor
          "$BIN" serve --port 8795 > "$RUNNER_TEMP/release-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8795/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8795/api/v1/health | grep -q "\"version\":\"$expected\""
          curl -fsS http://127.0.0.1:8795/api/v1/ready
          curl -fsS http://127.0.0.1:8795/ | grep -q 'id="root"'
      - name: Download the platform binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: hcs-discovery-*
          path: dist
          merge-multiple: true
      - name: Generate a CycloneDX SBOM
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uvx --from cyclonedx-bom==7.5.0 cyclonedx-py environment .venv/bin/python \
            --pyproject pyproject.toml \
            --output-reproducible \
            --of JSON \
            --output-file dist/sbom.cdx.json
      - name: Write checksums
        run: |
          cd dist
          sha256sum ./*.whl ./hcs-discovery-* sbom.cdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance for the release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/hcs-discovery-*
      - name: Upload assets to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          TITLE="HCS Discovery Studio ${RELEASE_TAG#v} (Stable)"
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_ARGS+=(--prerelease)
            TITLE="HCS Discovery Studio ${RELEASE_TAG#v} (Release Candidate)"
          fi
          if [ -f "docs/releases/${RELEASE_TAG}.md" ]; then
            NOTES=(--notes-file "docs/releases/${RELEASE_TAG}.md")
          else
            NOTES=(--generate-notes)
          fi
          gh release create "$RELEASE_TAG" \
            dist/*.whl dist/hcs-discovery-* dist/sbom.cdx.json dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --target "$SHA" \
            --title "$TITLE" \
            "${EXTRA_ARGS[@]}" \
            "${NOTES[@]}"
      - name: Verify the uploaded assets against local checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/downloaded"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/downloaded"
          cmp dist/SHA256SUMS.txt "$RUNNER_TEMP/downloaded/SHA256SUMS.txt"
          (cd "$RUNNER_TEMP/downloaded" && sha256sum -c SHA256SUMS.txt)
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Summarize published assets
        run: |
          {
            echo "## Release ${RELEASE_TAG}"
            echo
            echo "Commit: \`${SHA}\` (CI and CodeQL verified for this exact SHA)."
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  container:
    name: Publish the container image to GHCR
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
      - name: Smoke-test the published image
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}:${RELEASE_TAG}"
          token="release-smoke-token"
          docker run -d --name hcs-release -p 8796:8787 -e HCS_API_TOKEN="$token" "$image"
          trap 'docker rm -f hcs-release >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8796/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8796/api/v1/health
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8796/api/v1/ready
          docker rm -f hcs-release >/dev/null

  # Optional PyPI publication. It is skipped unless the repository variable  # PYPI_PUBLISH is "true" and a trusted publisher for this repository + workflow
  # ("release.yml") + environment ("pypi") is registered on PyPI. No long-lived token
  # exists anywhere: GitHub mints a short-lived OIDC token, PyPI exchanges it for an
  # upload credential and records a PEP 740 provenance attestation.
  pypi:
    name: Publish to PyPI (trusted publishing)
    needs: [verify, publish]
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: pypi
      url: https://pypi.org/project/hcs-discovery-studio/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build the SPA (the wheel bundles it)
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Build the wheel
        run: |
          uv sync --frozen --no-dev
          uv build --wheel
      - name: Check the distributions
        run: |
          uvx --from twine==6.1.0 twine check --strict dist/*.whl
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: true
